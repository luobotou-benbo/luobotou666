    <canvas id="canvas" width="300" height="400" style="background: #70c5ce; border: 2px solid white;"></canvas>

<script>
    // 1. 卡密验证逻辑
    function checkPassword() {
        var input = document.getElementById("password-input").value;
        if (input === "luobotounb666") {
            document.getElementById("verify-section").style.display = "none";
            document.getElementById("download-section").style.display = "block";
        } else {
            document.getElementById("error-msg").style.display = "block";
        }
    }

    // 2. 版本号彩蛋逻辑 (3秒内点7次)
    let clickCount = 0;
    let timer = null;
    document.getElementById("version-tag").onclick = function() {
        clickCount++;
        clearTimeout(timer);
        timer = setTimeout(() => { clickCount = 0; }, 3000);
        if (clickCount >= 7) {
            clickCount = 0;
            startGame();
        }
    };

    // 3. 小游戏逻辑
    let gameRunning = false;
    let score = 0;
    let birdY = 150, birdVY = 0;
    let pipes = [];
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function startGame() {
        document.getElementById("game-modal").style.display = "flex";
        gameRunning = true;
        score = 0;
        birdY = 150;
        pipes = [];
        document.getElementById("score").innerText = score;
        gameLoop();
    }

    function closeGame() {
        gameRunning = false;
        document.getElementById("game-modal").style.display = "none";
    }

    function flap() { if(gameRunning) birdVY = -8; }
    canvas.addEventListener("click", flap);

    function gameLoop() {
        if (!gameRunning) return;
        ctx.clearRect(0, 0, 300, 400);
        
        // 物理
        birdVY += 0.5;
        birdY += birdVY;
        ctx.font = "24px serif";
        ctx.fillText("🥕", 50, birdY);

        // 管道
        if (pipes.length === 0 || pipes[pipes.length-1].x < 150) {
            pipes.push({ x: 300, top: Math.random() * 200 + 50 });
        }
        for (let i = 0; i < pipes.length; i++) {
            let p = pipes[i];
            p.x -= 2;
            ctx.fillStyle = "green";
            ctx.fillRect(p.x, 0, 40, p.top);
            ctx.fillRect(p.x, p.top + 100, 40, 300);
            
            // 计分
            if (!p.passed && p.x + 40 < 50) { score++; p.passed = true; document.getElementById("score").innerText = score; }
            // 碰撞
            if (50 + 24 > p.x && 50 < p.x + 40 && (birdY < p.top || birdY + 24 > p.top + 100)) {
                gameRunning = false;
                alert("Game Over! 得分: " + score);
            }
        }
        if (pipes[0] && pipes[0].x < -40) pipes.shift();
        if (birdY > 400 || birdY < 0) { gameRunning = false; alert("Game Over!"); }

        requestAnimationFrame(gameLoop);
    }
</script>
