<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萝卜头本波的资源站</title>
    <style>
        /* --- 基础样式 --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            color: #333;
            scroll-behavior: smooth; /* 平滑滚动 */
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            min-height: 100vh;
            background: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* --- 顶部导航与汉堡菜单 --- */
        .header-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            border-bottom: 1px solid #eee;
        }

        .menu-btn {
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            color: #333;
        }

        .page-title {
            font-weight: bold;
            font-size: 18px;
        }

        /* --- 侧边导航菜单 --- */
        .sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background: #fff;
            z-index: 200;
            transition: 0.3s;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            padding-top: 60px;
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 150;
            display: none;
        }

        .sidebar-overlay.active {
            display: block;
        }

        .nav-item {
            display: block;
            padding: 15px 20px;
            text-decoration: none;
            color: #333;
            font-size: 16px;
            border-bottom: 1px solid #f5f5f5;
            transition: 0.2s;
        }

        .nav-item:hover {
            background: #f0f2f5;
            color: #ff6b00;
        }

        /* --- 霸气萝卜动画 --- */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeOut 0.5s ease-in-out 2.5s forwards;
        }

        .radish-icon {
            font-size: 80px;
            animation: bounceIn 1s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .radish-text {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #ff6b00;
            opacity: 0;
            animation: slideUp 0.8s ease-out 1s forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0) translateY(-100px); opacity: 0; }
            60% { transform: scale(1.1) translateY(10px); opacity: 1; }
            100% { transform: scale(1) translateY(0); }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        /* --- 内容区域 --- */
        .content {
            padding: 80px 20px 20px;
        }

        /* --- 卡密区域 --- */
        .card-section {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.2);
        }

        .input-group {
            margin: 15px 0;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        button.verify-btn {
            background: #333;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button.verify-btn:active {
            transform: scale(0.95);
        }

        .admin-link {
            color: #fff;
            text-decoration: underline;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- 分区标题 --- */
        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin: 30px 0 15px;
            padding-left: 10px;
            border-left: 4px solid #ff6b00;
            display: flex;
            align-items: center;
        }

        /* --- 应用/资料卡片 --- */
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .item-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: #ff6b00;
        }

        .item-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .item-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .item-desc {
            font-size: 12px;
            color: #888;
        }

        /* --- 弹窗样式 --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 80%;
            max-width: 300px;
            text-align: center;
            animation: popIn 0.3s;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-modal {
            margin-top: 15px;
            background: #eee;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 霸气开场动画 -->
    <div class="splash-screen">
        <div class="radish-icon">🥕</div>
        <div class="radish-text">萝卜头本波<br>资源站加载中...</div>
    </div>

    <!-- 侧边栏遮罩 -->
    <div class="sidebar-overlay" onclick="toggleMenu()"></div>

    <!-- 侧边栏菜单 -->
    <div class="sidebar" id="sidebar">
        <a href="#apps" class="nav-item" onclick="toggleMenu()">📱 实用应用</a>

    <!-- 顶部导航 -->

    <div class="container">
        <div class="content">
            
            <!-- 1. 卡密获取区 -->
            <div class="card-section">

                <p style="font-size: 14px; opacity: 0.9;">

            <!-- 2. 实用应用区 -->

        </div>

            <button class="close-modal" onclick="closeModal()">取消</button>

        // 打开抖音主页
