<!DOCTYPE html>
<html lang="zh‑CN">
<head>
    <meta charset="UTF‑8">
    <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
    <title>资源站‑管理后台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font‑awesome@4.7.0/css/font‑awesome.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box‑sizing: border‑box;
            font‑family: "PingFang SC", "Microsoft YaHei", system‑ui, sans‑serif;
        }
        body {
            background‑gradient: linear‑gradient(135deg, #f0f4f9, #e8edf5);
            min‑height: 100vh;
            padding:24px 16px;
        }
        .container {
            max‑width: 1080px;
            margin:0 auto;
        }
        .page‑title {
            text‑align:center;
            color:#1e293b;
            margin‑bottom:28px;
            font‑size:26px;
            font‑weight:600;
        }
        .card {
            background:#ffffff;
            border‑radius:16px;
            box‑shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding:24px;
            margin‑bottom:24px;
        }
        .card‑title {
            font‑size:18px;
            font‑weight:600;
            color:#222;
            margin‑bottom:18px;
            display:flex;
            align‑items:center;
            gap:8px;
        }
        .form‑item {
            margin‑bottom:16px;
        }
        label {
            display:block;
            margin‑bottom:6px;
            font‑size:14px;
            color:#475569;
        }
        input,textarea {
            width:100%;
            border:1px solid #cbd5e1;
            border‑radius:10px;
            padding:12px 14px;
            font‑size:15px;
            transition:0.25s;
            background:#fbfcfe;
        }
        input:focus,textarea:focus {
            outline:none;
            border‑color:#2563eb;
            box‑shadow:0 0 0 3px rgba(37,99,235,0.15);
        }
        textarea {
            min‑height:90px;
            resize:vertical;
        }
        .btn‑row {
            display:flex;
            gap:12px;
            flex‑wrap:wrap;
        }
        button {
            padding:11px 20px;
            border‑radius:10px;
            border:none;
            cursor:pointer;
            font‑size:15px;
            font‑weight:500;
            transition:0.2s;
            display:flex;
            align‑items:center;
            gap:6px;
        }
        .btn‑primary {
            background‑color:#2563eb;
            color:white;
        }
        .btn‑primary:hover {
            background‑color:#1d4ed8;
        }
        .btn‑danger {
            background‑color:#dc2626;
            color:white;
        }
        .btn‑danger:hover {
            background‑color:#b91c1c;
        }
        .btn‑default {
            background‑color:#e2e8f0;
            color:#334155;
        }
        .btn‑default:hover {
            background‑color:#cbd5e1;
        }
        .resource‑item {
            border:1px solid #e2e8f0;
            border‑radius:12px;
            padding:18px;
            margin‑bottom:14px;
            background:#fafbfd;
        }
        .res‑header {
            display:flex;
            justify‑content:space‑between;
            align‑items:flex‑start;
            flex‑wrap:wrap;
            gap:10px;
            margin‑bottom:8px;
        }
        .res‑title {
            font‑weight:600;
            font‑size:16px;
            color:#1e293b;
        }
        .res‑meta {
            font‑size:13px;
            color:#64748b;
            margin‑bottom:8px;
        }
        .res‑desc {
            font‑size:14px;
            color:#475569;
            margin‑bottom:12px;
        }
        .login‑wrap {
            max‑width:460px;
            margin:80px auto 0;
        }
        .tip‑text {
            font‑size:13px;
            color:#94a3b8;
            margin‑top:6px;
        }
    </style>
</head>
<body>
<div class="container">
    <!--登录面板-->
    <div id="loginPanel" class="login‑wrap">
        <div class="card">
            <div class="card‑title"><i class="fa‑solid fa‑lock"></i>管理员登录</div>
            <div class="form‑item">
                <label>管理员密码</label>
                <input type="password" id="adminPwd" placeholder="请输入后台管理密码">
            </div>
            <button class="btn‑primary" onclick="login()"><i class="fa‑solid fa‑sign‑in"></i>登录管理后台</button>
        </div>
    </div>

    <!--主操作面板（登录成功之后显示）-->
    <div id="mainPanel" style="display:none;">
        <h2 class="page‑title">📦资源站管理后台</h2>

        <!--新增 / 修改表单卡片-->
        <div class="card">
            <div class="card‑title"><i class="fa‑solid fa‑plus‑circle"></i>录入 / 修改资源信息</div>
            <div class="form‑item">
                <label>资源ID <span class="tip‑text">新增资源留空；编辑资源自动填入ID</span></label>
                <input id="editId" placeholder="新增无需填写">
            </div>
            <div class="form‑item">
                <label>资源名称</label>
                <input id="editTitle" placeholder="填写软件/资源名称">
            </div>
            <div class="form‑item">
                <label>资源简介描述</label>
                <textarea id="editDesc" placeholder="简单描述资源功能特点"></textarea>
            </div>
            <div class="form‑item">
                <label>夸克网盘下载完整链接</label>
                <input id="editLink" placeholder="https://pan.quark.cn/s/xxxxxxx">
            </div>
            <div class="form‑item">
                <label>文件大小</label>
                <input id="editSize" placeholder="例：316.5M、1.2G">
            </div>

            <div class="btn‑row">
                <button class="btn‑primary" onclick="saveResource()"><i class="fa‑solid fa‑save"></i>保存资源信息</button>
                <button class="btn‑default" onclick="clearForm()"><i class="fa‑solid fa‑eraser"></i>清空表单</button>
            </div>
        </div>

        <!--资源列表卡片-->
        <div class="card">
            <div class="card‑title"><i class="fa‑solid fa‑list"></i>全部资源列表</div>
            <div id="resourceListBox"></div>
        </div>
    </div>
</div>

<script>
// =====================👉【这里填入后端部署完成得到的域名！！】=====================
const API_BASE = "https://sour‑horse‑9406.deno.dev";
let adminAuthToken = null;

//登录
async function login(){
    const pwd = document.getElementById("adminPwd").value.trim();
    if(!pwd){
        alert("请输入管理员密码");
        return;
    }
    const resp = await fetch(`${API_BASE}/api/admin/auth`,{
        method:"POST",
        headers:{"Content‑Type":"application/json"},
        body:JSON.stringify({password:pwd})
    });
    const resJson = await resp.json();
    if(resJson.ok === true){
        adminAuthToken = pwd;
        document.getElementById("loginPanel").style.display = "none";
        document.getElementById("mainPanel").style.display = "block";
        loadAllResourceList();
    }else{
        alert("❌密码错误，请重新输入");
    }
}

//加载全部资源列表
async function loadAllResourceList(){
    const res = await fetch(`${API_BASE}/api/list`);
    const arr = await res.json();
    const wrapDom = document.getElementById("resourceListBox");
    wrapDom.innerHTML = "";
    if(arr.length === 0){
        wrapDom.innerHTML = `<div style="padding:20px;text‑align:center;color:#94a3b8;">暂无资源，请录入第一条资源</div>`;
        return;
    }
    arr.forEach(item=>{
        wrapDom.innerHTML += `
        <div class="resource‑item">
            <div class="res‑header">
                <span class="res‑title">${item.title}</span>
                <span class="res‑meta">下载次数：${item.downloadCount}｜文件大小：${item.size}</span>
            </div>
            <div class="res‑desc">${item.desc || "无简介"}</div>
            <div class="btn‑row">
                <button class="btn‑primary" onclick="fillEditData(${JSON.stringify(item).replaceAll("'","\\'")})">
                    <i class="fa‑solid fa‑pencil"></i>编辑
                </button>
                <button class="btn‑danger" onclick="deleteResItem('${item.id}')">
                    <i class="fa‑solid fa‑trash"></i>删除
                </button>
            </div>
        </div>
        `;
    })
}

//把选中资源填入编辑表单
function fillEditData(obj){
    document.getElementById("editId").value = obj.id || "";
    document.getElementById("editTitle").value = obj.title || "";
    document.getElementById("editDesc").value = obj.desc || "";
    document.getElementById("editLink").value = obj.link || "";
    document.getElementById("editSize").value = obj.size || "";
    window.scrollTo({top:0,behavior:"smooth"});
}

//保存新增/编辑资源
async function saveResource(){
    const payload = {
        id: document.getElementById("editId").value.trim(),
        title: document.getElementById("editTitle").value.trim(),
        desc: document.getElementById("editDesc").value.trim(),
        link: document.getElementById("editLink").value.trim(),
        size: document.getElementById("editSize").value.trim(),
        downloadCount:0
    };
    if(!payload.title){
        alert("资源名称不能为空");
        return;
    }
    if(!payload.link){
        alert("网盘下载链接不能为空");
        return;
    }
    await fetch(`${API_BASE}/api/admin/save`,{
        method:"POST",
        headers:{
            "Content‑Type":"application/json",
            "X‑Admin‑Token": adminAuthToken
        },
        body:JSON.stringify(payload)
    });
    clearForm();
    await loadAllResourceList();
    alert("✅保存成功！前端资源展示页面可以读取这条资源");
}

//删除资源记录
async function deleteResItem(id){
    if(!confirm("⚠️确认要删除该条资源记录？删除后前端页面不再展示这条资源。")) return;
    await fetch(`${API_BASE}/api/admin/del?id=${id}`,{
        headers:{
            "X‑Admin‑Token": adminAuthToken
        }
    });
    await loadAllResourceList();
    alert("✅已删除");
}

//清空表单
function clearForm(){
    ["editId","editTitle","editDesc","editLink","editSize"].forEach(domId=>{
        document.getElementById(domId).value = "";
    })
}
</script>
</body>
</html>
